<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ahli Bordir - Pemasukan Barang</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#111315; --card:#1a1d20; --line:#30353a; --text:#f3f4f6; --muted:#a7adb4;
      --accent:#2fbf7f; --danger:#d75c5c;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { width:min(1100px, 100%); margin:auto; padding:18px; }
    h1,h2 { margin:.2rem 0 .8rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; }
    .grid { display:grid; gap:12px; }
    .g2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .g3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
    label { display:grid; gap:6px; font-size:14px; color:var(--muted); }
    input, select, button {
      width:100%; min-height:44px; border-radius:10px; border:1px solid var(--line);
      background:#111315; color:var(--text); padding:10px 12px; font-size:16px;
    }
    button { cursor:pointer; font-weight:700; }
    button.primary { background:var(--accent); color:#07140f; border:none; }
    button.secondary { width:auto; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .between { justify-content:space-between; }
    .muted { color:var(--muted); font-size:14px; }
    .hidden { display:none !important; }
    .orders { display:grid; gap:10px; }
    .order { border:1px solid var(--line); border-radius:14px; padding:14px; }
    .order strong { font-size:17px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
    .stat { border:1px solid var(--line); border-radius:12px; padding:12px; }
    .stat b { display:block; font-size:20px; margin-top:4px; }
    .status { width:auto; min-width:150px; }
    .error { color:#ff9d9d; }
    .ok { color:#8ce5b9; }
    @media(max-width:700px) {
      .g2,.g3,.stats { grid-template-columns:1fr; }
      .wrap { padding:12px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Ahli Bordir — Pemasukan Barang</h1>
  <p class="muted">Terhubung ke database Supabase.</p>

  <section id="loginCard" class="card">
    <h2>Login</h2>
    <form id="loginForm" class="grid g2">
      <label>Email
        <input id="email" type="email" autocomplete="username" required>
      </label>
      <label>Password
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="primary" type="submit">Masuk</button>
    </form>
    <div id="loginMsg" class="muted"></div>
  </section>

  <section id="app" class="hidden">
    <div class="card row between">
      <div>
        <strong id="userEmail"></strong>
        <div class="muted">Akun aktif</div>
      </div>
      <button id="logoutBtn" class="secondary" type="button">Keluar</button>
    </div>

    <section class="card">
      <h2>Input Order</h2>
      <form id="orderForm" class="grid">
        <div class="grid g2">
          <label>Nomor PO
            <input id="po" required placeholder="Contoh: Topi PKS">
          </label>
          <label>Nama Konsumen
            <input id="customer" list="customerList" required placeholder="Ketik atau pilih konsumen">
            <datalist id="customerList"></datalist>
          </label>
        </div>
        <div class="grid g3">
          <label>Jumlah Barang
            <input id="qty" type="number" min="1" step="1" value="1" required>
          </label>
          <label>Titik Design
            <input id="points" type="number" min="1" step="1" value="1" required>
          </label>
          <label>Harga / Barang
            <input id="price" type="number" min="0" step="500" required placeholder="25000">
          </label>
        </div>
        <div class="card" style="margin:0">
          <span class="muted">Total otomatis</span>
          <h2 id="total">Rp0</h2>
        </div>
        <button class="primary" type="submit">Simpan Order</button>
        <div id="orderMsg" class="muted"></div>
      </form>
    </section>

    <section class="card">
      <div class="stats">
        <div class="stat"><span class="muted">Order aktif</span><b id="activeOrders">0</b></div>
        <div class="stat"><span class="muted">Barang masih di tempat</span><b id="activeItems">0 pcs</b></div>
        <div class="stat"><span class="muted">Nilai order aktif</span><b id="activeValue">Rp0</b></div>
      </div>

      <div class="row between">
        <div>
          <h2>Daftar Order</h2>
          <div class="muted">Cari berdasarkan konsumen atau PO.</div>
        </div>
        <button id="refreshBtn" class="secondary" type="button">Refresh</button>
      </div>

      <div class="grid g2" style="margin:12px 0">
        <input id="search" type="search" placeholder="Cari Tjo, UIN, Topi PKS...">
        <label class="row" style="display:flex;color:var(--text)">
          <input id="activeOnly" type="checkbox" checked style="width:auto">
          Hanya barang yang masih ada
        </label>
      </div>

      <div id="orders" class="orders"></div>
      <div id="empty" class="muted hidden">Tidak ada order yang cocok.</div>
    </section>
  </section>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://qbwcxeyzqtaeaatphgvh.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_U0OvyY9gotE0YQFCzBRJyg_o14WTfOD';
  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const $ = (s) => document.querySelector(s);
  let allOrders = [];
  let customers = [];

  const rupiah = (n) => new Intl.NumberFormat('id-ID', {
    style:'currency', currency:'IDR', maximumFractionDigits:0
  }).format(Number(n) || 0);

  function calcTotal() {
    const qty = Math.max(1, Number($('#qty').value) || 1);
    const price = Math.max(0, Number($('#price').value) || 0);
    $('#total').textContent = rupiah(qty * price);
  }

  async function showSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      $('#loginCard').classList.add('hidden');
      $('#app').classList.remove('hidden');
      $('#userEmail').textContent = session.user.email || 'User';
      await loadEverything();
    } else {
      $('#loginCard').classList.remove('hidden');
      $('#app').classList.add('hidden');
    }
  }

  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('#loginMsg').textContent = 'Memeriksa login...';
    $('#loginMsg').className = 'muted';
    const { error } = await supabase.auth.signInWithPassword({
      email: $('#email').value.trim(),
      password: $('#password').value
    });
    if (error) {
      $('#loginMsg').textContent = 'Login gagal: ' + error.message;
      $('#loginMsg').className = 'error';
      return;
    }
    $('#loginMsg').textContent = '';
    await showSession();
  });

  $('#logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    await showSession();
  });

  async function loadCustomers() {
    const { data, error } = await supabase
      .from('customers')
      .select('id,name')
      .order('name');
    if (error) throw error;
    customers = data || [];
    const list = $('#customerList');
    list.innerHTML = '';
    customers.forEach(c => {
      const o = document.createElement('option');
      o.value = c.name;
      list.appendChild(o);
    });
  }

  async function loadOrders() {
    const { data, error } = await supabase
      .from('orders')
      .select('id,po_number,quantity,design_points,price_per_item,status,created_at,customers(id,name)')
      .order('created_at', { ascending:false });
    if (error) throw error;
    allOrders = data || [];
    renderOrders();
  }

  async function loadEverything() {
    try {
      await Promise.all([loadCustomers(), loadOrders()]);
      $('#orderMsg').textContent = '';
    } catch (err) {
      $('#orderMsg').textContent = 'Gagal membaca database: ' + err.message;
      $('#orderMsg').className = 'error';
    }
  }

  function renderOrders() {
    const q = $('#search').value.trim().toLowerCase();
    const onlyActive = $('#activeOnly').checked;
    const visible = allOrders.filter(o => {
      const name = (o.customers?.name || '').toLowerCase();
      const po = (o.po_number || '').toLowerCase();
      return (!q || name.includes(q) || po.includes(q))
        && (!onlyActive || o.status !== 'Barang Keluar');
    });

    const active = allOrders.filter(o => o.status !== 'Barang Keluar');
    $('#activeOrders').textContent = active.length;
    $('#activeItems').textContent = active.reduce((a,o)=>a+Number(o.quantity||0),0) + ' pcs';
    $('#activeValue').textContent = rupiah(active.reduce((a,o)=>a+(Number(o.quantity||0)*Number(o.price_per_item||0)),0));

    const wrap = $('#orders');
    wrap.innerHTML = '';
    $('#empty').classList.toggle('hidden', visible.length > 0);

    visible.forEach(o => {
      const card = document.createElement('article');
      card.className = 'order';

      const top = document.createElement('div');
      top.className = 'row between';

      const info = document.createElement('div');
      const name = document.createElement('strong');
      name.textContent = o.customers?.name || 'Tanpa nama';
      const meta = document.createElement('div');
      meta.className = 'muted';
      const dt = new Date(o.created_at);
      meta.textContent = `${o.po_number} • ${dt.toLocaleString('id-ID')}`;
      info.append(name, meta);

      const select = document.createElement('select');
      select.className = 'status';
      ['Barang Masuk','Produksi','Selesai','Barang Keluar'].forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s; opt.selected = s === o.status;
        select.appendChild(opt);
      });
      select.addEventListener('change', async () => {
        const newStatus = select.value;
        select.disabled = true;
        const { error: e1 } = await supabase.from('orders').update({
          status:newStatus, updated_at:new Date().toISOString()
        }).eq('id',o.id);
        if (!e1) {
          const { error: e2 } = await supabase.from('order_status_history')
            .insert({ order_id:o.id, status:newStatus });
          if (e2) alert('Status berubah, tetapi riwayat gagal dicatat: ' + e2.message);
        } else {
          alert('Gagal mengubah status: ' + e1.message);
        }
        select.disabled = false;
        await loadOrders();
      });

      top.append(info, select);

      const d = document.createElement('div');
      d.className = 'grid g3';
      d.style.marginTop = '12px';
      const fields = [
        ['Jumlah', `${o.quantity} pcs`],
        ['Titik design', `${o.design_points} titik`],
        ['Harga / barang', rupiah(o.price_per_item)],
        ['Total', rupiah(Number(o.quantity)*Number(o.price_per_item))]
      ];
      fields.forEach(([k,v]) => {
        const x = document.createElement('div');
        const a = document.createElement('div'); a.className='muted'; a.textContent=k;
        const b = document.createElement('div'); b.textContent=v;
        x.append(a,b); d.appendChild(x);
      });

      card.append(top,d);
      wrap.appendChild(card);
    });
  }

  $('#orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const po = $('#po').value.trim();
    const customerName = $('#customer').value.trim();
    const qty = Number($('#qty').value);
    const points = Number($('#points').value);
    const price = Number($('#price').value);

    if (!po || !customerName || qty < 1 || points < 1 || price < 0) {
      $('#orderMsg').textContent = 'Periksa kembali data order.';
      $('#orderMsg').className = 'error';
      return;
    }

    $('#orderMsg').textContent = 'Menyimpan...';
    $('#orderMsg').className = 'muted';

    try {
      let customer = customers.find(c => c.name.toLowerCase() === customerName.toLowerCase());

      if (!customer) {
        const { data, error } = await supabase
          .from('customers')
          .insert({ name:customerName })
          .select('id,name')
          .single();
        if (error) throw error;
        customer = data;
      }

      const { data: order, error: orderError } = await supabase
        .from('orders')
        .insert({
          po_number:po,
          customer_id:customer.id,
          quantity:Math.floor(qty),
          design_points:Math.floor(points),
          price_per_item:price,
          status:'Barang Masuk'
        })
        .select('id')
        .single();
      if (orderError) throw orderError;

      const { error: histError } = await supabase
        .from('order_status_history')
        .insert({ order_id:order.id, status:'Barang Masuk' });
      if (histError) throw histError;

      $('#orderMsg').textContent = 'Order berhasil disimpan.';
      $('#orderMsg').className = 'ok';
      e.target.reset();
      $('#qty').value = '1';
      $('#points').value = '1';
      calcTotal();
      await loadEverything();
    } catch (err) {
      $('#orderMsg').textContent = 'Gagal menyimpan: ' + err.message;
      $('#orderMsg').className = 'error';
    }
  });

  $('#qty').addEventListener('input',calcTotal);
  $('#price').addEventListener('input',calcTotal);
  $('#search').addEventListener('input',renderOrders);
  $('#activeOnly').addEventListener('change',renderOrders);
  $('#refreshBtn').addEventListener('click',loadEverything);

  calcTotal();
  await showSession();
</script>
</body>
</html>
